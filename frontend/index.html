<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Konkursda Qatnashish</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Glassmorphism Styles -->
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            user-select: none;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card-glow {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.2);
        }

        .btn-neon {
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 100%);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            transition: all 0.3s ease;
        }

        .btn-neon:active {
            transform: scale(0.97);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }

        .pulse-glow {
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
            100% { box-shadow: 0 0 30px rgba(168, 85, 247, 0.7); }
        }
    </style>
</head>
<body class="p-4 pb-12">
    <div id="app" class="max-w-md mx-auto space-y-6">
        
        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center py-20 space-y-4">
            <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-slate-400 text-sm font-medium">Konkurs ma'lumotlari yuklanmoqda...</p>
        </div>

        <!-- Main Content (Hidden initially) -->
        <div id="content" class="hidden space-y-6">
            
            <!-- Contest Header / Banner -->
            <div class="glass-card rounded-3xl p-6 text-center relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-500/20 rounded-full blur-2xl"></div>
                <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-purple-500/20 rounded-full blur-2xl"></div>
                
                <div id="banner-container" class="mb-4 hidden">
                    <img id="contest-media" src="" alt="Giveaway Banner" class="w-full h-44 object-cover rounded-2xl border border-white/10 shadow-lg">
                </div>

                <span class="inline-block px-3 py-1 bg-indigo-500/20 text-indigo-300 rounded-full text-xs font-semibold uppercase tracking-wider mb-2 border border-indigo-500/30">
                    <i class="fa-solid fa-trophy mr-1"></i> Rasmiy Konkurs
                </span>

                <h1 id="contest-title" class="text-2xl font-black text-white tracking-tight mb-2">---</h1>
                <p id="contest-desc" class="text-slate-300 text-sm leading-relaxed mb-4">---</p>

                <!-- Timer & Stats -->
                <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-white/10">
                    <div class="bg-white/5 rounded-2xl p-3 text-center border border-white/5">
                        <span class="text-xs text-slate-400 block mb-1">Qatnashchilar</span>
                        <span id="participants-count" class="text-lg font-bold text-indigo-400">0</span>
                    </div>
                    <div class="bg-white/5 rounded-2xl p-3 text-center border border-white/5">
                        <span class="text-xs text-slate-400 block mb-1">Tugash Vaqti</span>
                        <span id="end-date" class="text-xs font-semibold text-purple-300">--:--</span>
                    </div>
                </div>
            </div>

            <!-- Ticket Status Card (If already joined) -->
            <div id="ticket-card" class="hidden glass-card-glow rounded-3xl p-6 text-center relative overflow-hidden pulse-glow">
                <div class="w-14 h-14 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-emerald-500/30">
                    <i class="fa-solid fa-circle-check text-2xl"></i>
                </div>
                <h3 class="text-lg font-bold text-white mb-1">Siz Qatnashmoqdasiz!</h3>
                <p class="text-slate-300 text-xs mb-4">Sizning maxsus omadli chiptangiz raqami:</p>
                <div class="inline-block bg-emerald-500/10 border border-emerald-500/30 rounded-xl px-6 py-2">
                    <span id="ticket-code" class="text-xl font-mono font-bold tracking-widest text-emerald-400">#TKT-XXXXX</span>
                </div>
            </div>

            <!-- Sponsor Channels Section -->
            <div id="tasks-section" class="space-y-3">
                <div class="flex items-center justify-between px-1">
                    <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider">
                        <i class="fa-solid fa-tasks text-indigo-400 mr-2"></i> Majburiy Shartlar
                    </h2>
                    <span id="progress-text" class="text-xs font-semibold text-indigo-300 bg-indigo-500/10 px-2 py-0.5 rounded-full">0/0 bajarildi</span>
                </div>

                <!-- Channels List -->
                <div id="sponsors-list" class="space-y-2.5">
                    <!-- Dynamic rendering -->
                </div>
            </div>

            <!-- Action Button -->
            <div id="action-container" class="pt-2">
                <button id="join-btn" onclick="handleJoinContest()" class="w-full btn-neon text-white font-bold py-4 px-6 rounded-2xl text-base flex items-center justify-center space-x-2 shadow-xl">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Konkursda Qatnashish</span>
                </button>
            </div>

        </div>

    </div>

    <!-- Application Script -->
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // URL parametrlaridan yoki Telegram startapp paramidan contest_id olish
        const urlParams = new URLSearchParams(window.location.search);
        let contestId = urlParams.get('contest_id') || urlParams.get('startapp') || urlParams.get('tgWebAppStartParam');
        
        if (!contestId && window.Telegram?.WebApp?.initDataUnsafe?.start_param) {
            contestId = window.Telegram.WebApp.initDataUnsafe.start_param.replace('contest_', '');
        }
        
        if (!contestId) contestId = 1;
        const initData = tg?.initData || "";

        let currentContest = null;

        async function loadContestData() {
            try {
                const response = await fetch(`api/contest/${contestId}`, {
                    headers: {
                        'x-telegram-init-data': initData
                    }
                });



                if (!response.ok) {
                    throw new Error("Konkursni yuklashda xatolik");
                }

                currentContest = await response.json();
                renderContest(currentContest);
            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerHTML = `
                    <div class="text-red-400 text-center">
                        <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
                        <p class="font-medium">${err.message}</p>
                    </div>
                `;
            }
        }

        function renderContest(data) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');

            document.getElementById('contest-title').innerText = data.title;
            document.getElementById('contest-desc').innerText = data.description;
            document.getElementById('participants-count').innerText = data.participants_count;
            
            const endDate = new Date(data.end_date);
            document.getElementById('end-date').innerText = endDate.toLocaleDateString() + ' ' + endDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            if (data.media_url) {
                document.getElementById('contest-media').src = data.media_url;
                document.getElementById('banner-container').classList.remove('hidden');
            }

            // Ticket Status
            if (data.is_joined) {
                document.getElementById('ticket-card').classList.remove('hidden');
                document.getElementById('ticket-code').innerText = '#' + data.ticket_code;
                document.getElementById('action-container').classList.add('hidden');
            }

            // Sponsors List
            const sponsorsList = document.getElementById('sponsors-list');
            sponsorsList.innerHTML = '';

            let subbedCount = 0;
            data.sponsors.forEach((sponsor, index) => {
                if (sponsor.is_subscribed) subbedCount++;

                const card = document.createElement('div');
                card.className = 'glass-card rounded-2xl p-4 flex items-center justify-between transition-all hover:bg-white/10';
                
                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold">
                            ${index + 1}
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-white">${sponsor.title}</h4>
                            <span class="text-xs text-slate-400">Telegram Kanal</span>
                        </div>
                    </div>
                    <div>
                        <a href="${sponsor.invite_link}" target="_blank" onclick="tg?.HapticFeedback?.impactOccurred('light')" 
                           class="px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1.5 ${
                               sponsor.is_subscribed 
                               ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' 
                               : 'bg-indigo-600 hover:bg-indigo-500 text-white'
                           }">
                            <span>${sponsor.is_subscribed ? 'Azo bo\'lingan' : 'Obuna bo\'lish'}</span>
                            <i class="fa-solid ${sponsor.is_subscribed ? 'fa-check' : 'fa-arrow-right'} text-[10px]"></i>
                        </a>
                    </div>
                `;
                sponsorsList.appendChild(card);
            });

            document.getElementById('progress-text').innerText = `${subbedCount}/${data.sponsors.length} bajarildi`;
        }

        async function handleJoinContest() {
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }

            const joinBtn = document.getElementById('join-btn');
            joinBtn.disabled = true;
            joinBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>Tekshirilmoqda...</span>`;

            try {
                const response = await fetch(`api/contest/${contestId}/join`, {
                    method: 'POST',
                    headers: {
                        'x-telegram-init-data': initData
                    }
                });


                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || "Xatolik yuz berdi");
                }

                tg?.showAlert(result.message);
                loadContestData(); // UI ni yangilash
            } catch (err) {
                tg?.showAlert(err.message);
                joinBtn.disabled = false;
                joinBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>Konkursda Qatnashish</span>`;
            }
        }

        // Dastlabki yuklash
        loadContestData();
    </script>
</body>
</html>
